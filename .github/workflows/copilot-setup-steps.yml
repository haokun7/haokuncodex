name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install writing and presentation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-lfs \
            pandoc \
            texlive-xetex \
            texlive-lang-chinese \
            fonts-noto-cjk \
            python3-pip
          git lfs install

      - name: Install Python packages for document and PPT generation
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            python-pptx \
            pypandoc \
            pymupdf \
            reportlab

      - name: Verify key tools
        run: |
          node --version
          npm --version
          pandoc --version
          xelatex --version
          python --version
          python -c "import pptx, pypandoc, fitz, reportlab; print('python packages ok')"
