name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install writing and presentation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-lang-chinese \
            fonts-noto-cjk \
            python3-pip

      - name: Install Python packages for document and PPT generation
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            python-pptx \
            pypandoc \
            pymupdf \
            reportlab

      - name: Verify key tools
        run: |
          pandoc --version
          xelatex --version
          python3 -c "import pptx, pypandoc, fitz, reportlab; print('python packages ok')"
